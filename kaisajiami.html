<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #ffffff;
  --panel: #f5f5f5;
  --border: #e0e0e0;
  --text: #1a1a1a;
  --text-secondary: #888888;
  --accent: #0066cc;

  --success: #2ea043;

}

html { scroll-behavior: smooth; font-size: 16px; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }

.container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

/* ========== Navigation ========== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;

  transition: box-shadow 0.3s;
}
.nav.scrolled { box-shadow: 0 1px 12px rgba(0,0,0,0.06); }
.nav-inner {

  height: 56px; padding: 0 24px;
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 1.05rem; color: var(--text);
}
.nav-logo {
  width: 30px; height: 30px; background: var(--accent);
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px;
}
.nav-links { display: flex; gap: 32px; }
.nav-links a {
  font-size: 0.9rem; color: var(--text-secondary);
  transition: color 0.2s; position: relative;
}
.nav-links a:hover { color: var(--accent); }
.nav-hamburger {
  display: none; flex-direction: column; gap: 5px;
  cursor: pointer; padding: 4px;
}
.nav-hamburger span {
  display: block; width: 22px; height: 2px;
  background: var(--text); border-radius: 1px;

}

/* ========== Hero ========== */
.hero {

.hero-content {

}
.hero-mask {

}
@keyframes maskPulse {

}
@keyframes heroFadeIn {
  to { opacity: 1; transform: translateY(0); }
}
.hero-badge {

}
.hero p {
  font-size: clamp(1rem, 2.2vw, 1.2rem);

.btn-primary {

.footer-links { display: flex; gap: 24px; justify-content: center; margin-top: 12px; }

/* ========== Scroll Animations ========== */

/* ========== Admin Gate (Internal Management Login) ========== */

<body>

<!-- Admin Gate: 官方内部管理登录 -->
<div id="adminGate">
  <div class="admin-card">
    <div class="admin-sys-head">

        <div class="admin-sys-title">TL 工作室 · 内部管理系统</div>

</div>





<!-- Cipher Tool -->
<section class="cipher" id="cipher">
  <div class="container">
    <div class="text-center">
      <span class="section-label">在线工具</span>
      <h2 class="section-title">TL专用加密加解密</h2>
      <p class="section-desc">输入文字，一键加密或解密（我们的专用偏移8）</p>
    </div>
    <div class="cipher-wrap">
      <div class="cipher-head">
        <div class="cipher-title">🔐 加密 / 解密</div>
        <div class="shift-box">
          <label>我们的专用偏移</label>
          <span class="shift-input" style="display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent)">8</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label">输入内容</label>
        <textarea class="cipher-textarea" id="inputText" placeholder="在这里输入要加密或解密的文字…"></textarea>
      </div>

      <div class="btn-row">
        <button class="tool-btn encrypt" onclick="encrypt()">🔒 加密</button>
        <button class="tool-btn decrypt" onclick="decrypt()">🔓 解密</button>
      </div>

      <div class="field" style="margin-bottom:8px">
        <label class="field-label">输出结果</label>
        <textarea class="cipher-textarea" id="outputText" readonly placeholder="加密 / 解密结果将显示在这里…"></textarea>
      </div>

      <div class="toolbar">
        <button class="tool-btn copy" onclick="copyOutput()">📋 复制结果</button>
        <button class="tool-btn" onclick="clearAll()">清空</button>
      </div>
    </div>
  </div>
</section>











<script>




/* ========== Scroll ========== */
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.15 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

/* ========== Caesar Cipher Logic ========== */
function clampShift() {
  return 8;
}

function caesar(text, shift) {
  shift = ((shift % 26) + 26) % 26;
  let out = '';
  for (let i = 0; i < text.length; i++) {
    const c = text.charCodeAt(i);
    if (c >= 65 && c <= 90) {
      out += String.fromCharCode((c - 65 + shift) % 26 + 65);
    } else if (c >= 97 && c <= 122) {
      out += String.fromCharCode((c - 97 + shift) % 26 + 97);
    } else if (c === 32 || (c >= 48 && c <= 57) || (c >= 0x4e00 && c <= 0x9fa5)) {
      // 空格、数字、中文：保留原样（不加密）
      out += text[i];
    }
    // 其余符号（标点、特殊字符等）：去掉
  }
  return out;
}

function encrypt() {
  const shift = clampShift();
  const input = document.getElementById('inputText').value;
  document.getElementById('outputText').value = caesar(input, shift);
}

function decrypt() {
  const shift = clampShift();
  const input = document.getElementById('inputText').value;
  document.getElementById('outputText').value = caesar(input, -shift);
}

function copyOutput() {
  const out = document.getElementById('outputText');
  if (!out.value) { alert('请先加密或解密生成结果'); return; }
  out.select();
  out.setSelectionRange(0, 99999);
  try {
    navigator.clipboard.writeText(out.value);
  } catch(e) {
    document.execCommand('copy');
  }
  const btn = document.querySelector('.tool-btn.copy');
  const old = btn.innerText;
  btn.innerText = '✅ 已复制';
  setTimeout(() => { btn.innerText = old; }, 1500);
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('outputText').value = '';
}



/* ========== Admin Gate (Management Code) ========== */
const ADMIN_CODES = ['tltzradmin', 'tlljradmin', 'tllxhadmin', 'tlwsyadmin'];

function adminLogin() {
  const code = document.getElementById('adminCode').value.trim();
  const err = document.getElementById('adminErr');
  if (ADMIN_CODES.indexOf(code) !== -1) {
    sessionStorage.setItem('tl_admin', '1');
    document.getElementById('adminGate').classList.add('hidden');
    document.getElementById('adminBar').classList.add('show');
    document.getElementById('adminName').textContent = '管理员 已登录';
    err.classList.remove('show');
  } else {
    err.classList.add('show');
  }
}
function adminLogout() {
  sessionStorage.removeItem('tl_admin');
  document.getElementById('adminBar').classList.remove('show');
  document.getElementById('adminGate').classList.remove('hidden');
  document.getElementById('adminCode').value = '';
}
// 回车快捷登录
window.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !document.getElementById('adminGate').classList.contains('hidden')) {
    adminLogin();
  }
});
// 会话内保持登录状态
if (sessionStorage.getItem('tl_admin') === '1') {
  document.getElementById('adminGate').classList.add('hidden');
  document.getElementById('adminBar').classList.add('show');
  document.getElementById('adminName').textContent = '管理员 已登录';
}

/* ========== Init ========== */
clampShift();
</script>
